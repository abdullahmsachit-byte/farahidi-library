<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتبة جامعة الفراهيدي</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#152033}header{background:#174a82;color:#fff;text-align:center;padding:25px}h1{margin:0 0 8px}.w{max-width:1100px;margin:auto;padding:16px}.bar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}input,select,button{font:inherit;padding:11px;border:1px solid #dbe2eb;border-radius:11px;background:#fff}#q{flex:1;min-width:220px}button{cursor:pointer}.green{background:#087548;color:#fff;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.card{background:#fff;border:1px solid #e2e7ee;border-radius:17px;padding:16px}.click{text-align:center;cursor:pointer}.icon{font-size:32px}.muted{font-size:13px;color:#6c7483}.book{display:grid;grid-template-columns:80px 1fr;gap:12px}.cover{height:105px;background:#edf2f8;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.price{font-weight:bold;color:#087548;margin-top:6px}.tools{display:flex;gap:6px;margin-top:8px}.edit{background:#fff3cd}.del{background:#fee2e2}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}.hide{display:none!important}.panel{background:#fff;width:min(560px,100%);max-height:94vh;overflow:auto;border-radius:18px;padding:18px}.form{display:grid;gap:8px}.form label{font-size:13px;font-weight:bold}.save{background:#087548;color:#fff;font-weight:bold;position:sticky;bottom:0}.back{margin-bottom:12px}.depttools{margin-top:8px;display:flex;justify-content:center;gap:5px}@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.book{grid-template-columns:1fr}.cover{height:130px}}</style></head>
<body><header><h1>📚 مكتبة جامعة الفراهيدي</h1><div>دليل الملازم الإلكتروني</div></header>
<div class="w"><div class="bar"><input id="q" placeholder="ابحث عن مادة أو أستاذ أو رقم..." oninput="searchBooks()"><button onclick="home()">الرئيسية</button><button id="loginBtn" onclick="loginAdmin()">🔐 دخول الإدارة</button><button id="addDept" class="green hide" onclick="openDept()">➕ إضافة قسم جديد</button><button id="logoutBtn" class="hide" onclick="logoutAdmin()">خروج</button></div><div id="main"></div></div>

<div id="bookModal" class="modal hide"><div class="panel"><button onclick="closeBook()">✕ إغلاق</button><h2 id="bookTitle">➕ إضافة ملزمة</h2>
<form id="bookForm" class="form"><input type="hidden" id="editId"><input type="hidden" id="fixedDept"><input type="hidden" id="fixedStage">
<label>اسم المادة</label><input name="subject" id="subject" required><label>اسم الأستاذ</label><input name="teacher" id="teacher">
<label>السعر</label><input name="price" id="price"><label>رقم الملزمة</label><input id="code">
<label>نوع الطباعة</label><select id="printtype"><option>أبيض وأسود</option><option>ملون</option></select>
<label>صورة الغلاف</label><input name="image" type="file" accept="image/*"><button class="save" type="submit">💾 حفظ الملزمة</button></form></div></div>

<div id="deptModal" class="modal hide"><div class="panel"><button onclick="closeDept()">✕ إغلاق</button><h2 id="deptTitle">➕ إضافة قسم جديد</h2>
<form id="deptForm" class="form"><input type="hidden" id="deptEditId"><label>اسم القسم</label><input id="deptName" required><label>عدد المراحل</label><select id="deptStages"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select><label>الأيقونة</label><input id="deptIcon" value="📚"><button class="save" type="submit">💾 حفظ القسم</button></form></div></div>


<script>
const defaults=[["الصيدلة","💊",5],["طب الأسنان","🦷",5],["التخدير","💉",4],["الأدلة الجنائية","🔬",4],["هندسة الطيران","✈️",4],["هندسة الاتصالات","📡",4],["الأجهزة الطبية","🩺",4],["الأشعة والسونار","🩻",4],["التكييف والتبريد","❄️",4],["الفيزياء الطبية","⚛️",4],["هندسة العمارة","🏛️",5],["القانون","⚖️",4],["المحاسبة","🧾",4],["إدارة الأعمال","🏢",4],["المالية والمصرفية","🏦",4],["هندسة الليزر","🔦",4],["الذكاء الاصطناعي","🤖",4],["الأمن السيبراني","🛡️",4],["الإنتاج النباتي","🌱",4]];
let all=[],books=[],ds=[],admin=false,currentDept="",currentStage=0;
const m=document.getElementById("main"),sn=n=>["","الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة"][n]||n;
function parse(){let c=all.filter(x=>x.dept==="__DEPARTMENT__");ds=defaults.slice();c.forEach(x=>{if(!ds.some(d=>d[0]===x.subject))ds.push([x.subject,x.teacher||"📚",Number(x.stage)||4,x.id])});books=all.filter(x=>x.dept!=="__DEPARTMENT__")}
async function reload(){all=await fetch("/api/books").then(r=>r.json());parse()}
async function status(){admin=(await fetch("/api/admin").then(r=>r.json())).admin;addDept.classList.toggle("hide",!admin);logoutBtn.classList.toggle("hide",!admin);loginBtn.classList.toggle("hide",admin)}
async function init(){await status();await reload();home()}
async function loginAdmin(){let p=prompt("اكتب كلمة سر الإدارة:");if(!p)return;let f=new FormData();f.set("password",p);let r=await fetch("/api/login",{method:"POST",body:f});if(!r.ok)return alert("كلمة السر غير صحيحة");await status();home()}
async function logoutAdmin(){await fetch("/api/logout",{method:"POST"});await status();home()}
function home(){currentDept="";currentStage=0;q.value="";m.innerHTML='<div class="grid">'+ds.map(d=>`<div class="card click" onclick="stages('${d[0].replaceAll("'","\\'")}')"><div class="icon">${d[1]}</div><b>${d[0]}</b><div class="muted">${d[2]} مراحل</div>${admin&&d[3]?`<div class="depttools"><button class="edit" onclick="event.stopPropagation();editDept(${d[3]})">✏️ تعديل</button><button class="del" onclick="event.stopPropagation();deleteDept(${d[3]})">🗑️ حذف</button></div>`:""}</div>`).join("")+'</div>'}
function stages(d){currentDept=d;let x=ds.find(a=>a[0]===d);m.innerHTML=`<button class="back" onclick="home()">← رجوع</button><h2>${d}</h2><div class="grid">${Array.from({length:x[2]},(_,i)=>`<div class="card click" onclick="show('${d.replaceAll("'","\\'")}',${i+1})"><b>المرحلة ${sn(i+1)}</b></div>`).join("")}</div>`}
function decode(b){let p=String(b.code||"").split("|||");return {code:p[0],pt:p[1]||"أبيض وأسود"}}
function card(b){let d=decode(b);return `<div class="card book"><div class="cover">${b.image?`<img src="${b.image}">`:"📘"}</div><div><b>${b.subject}</b><div class="muted">${b.teacher||""}</div><div class="price">${b.price||""}</div><div class="muted">🖨️ ${d.pt}</div><span class="muted">${d.code}</span>${admin?`<div class="tools"><button class="edit" onclick="editBook(${b.id})">✏️ تعديل</button><button class="del" onclick="deleteBook(${b.id})">🗑️ حذف</button></div>`:""}</div></div>`}
function show(d,s){currentDept=d;currentStage=s;let a=books.filter(b=>b.dept===d&&Number(b.stage)===s);let add=admin?`<button class="green" onclick="openBook('${d.replaceAll("'","\\'")}',${s})">➕ إضافة ملزمة لهذه المرحلة</button>`:"";m.innerHTML=`<button class="back" onclick="stages('${d.replaceAll("'","\\'")}')">← رجوع</button> ${add}<h2>${d} — المرحلة ${sn(s)}</h2><div class="grid">${a.length?a.map(card).join(""):'<div class="card">لا توجد ملازم مضافة حالياً.</div>'}</div>`}
function searchBooks(){let z=q.value.trim().toLowerCase();if(!z)return home();let a=books.filter(b=>Object.values(b).join(" ").toLowerCase().includes(z));m.innerHTML=`<h2>نتائج البحث</h2><div class="grid">${a.length?a.map(card).join(""):'<div class="card">لا توجد نتائج.</div>'}</div>`}
function openBook(d,s){bookForm.reset();editId.value="";fixedDept.value=d;fixedStage.value=s;bookTitle.textContent="➕ إضافة ملزمة";bookModal.classList.remove("hide")}
function closeBook(){bookModal.classList.add("hide")}
function editBook(id){let b=books.find(x=>x.id===id),d=decode(b);openBook(b.dept,b.stage);editId.value=id;bookTitle.textContent="✏️ تعديل الملزمة";subject.value=b.subject||"";teacher.value=b.teacher||"";price.value=b.price||"";code.value=d.code;printtype.value=d.pt}
bookForm.onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target);fd.set("id",editId.value);fd.set("dept",fixedDept.value);fd.set("stage",fixedStage.value);fd.set("code",(code.value||"")+"|||"+printtype.value);let r=await fetch("/api/save",{method:"POST",body:fd});if(r.ok){await reload();closeBook();show(fixedDept.value,Number(fixedStage.value));alert("تم الحفظ")}else alert("سجل دخول الإدارة أولاً")}
async function deleteBook(id){if(!confirm("حذف الملزمة؟"))return;let f=new FormData();f.set("id",id);await fetch("/api/delete",{method:"POST",body:f});await reload();show(currentDept,currentStage)}
function openDept(){deptForm.reset();deptEditId.value="";deptIcon.value="📚";deptStages.value="4";deptTitle.textContent="➕ إضافة قسم جديد";deptModal.classList.remove("hide")}
function closeDept(){deptModal.classList.add("hide")}
function editDept(id){let x=all.find(a=>a.id===id);openDept();deptEditId.value=id;deptName.value=x.subject;deptStages.value=x.stage;deptIcon.value=x.teacher||"📚";deptTitle.textContent="✏️ تعديل القسم"}
deptForm.onsubmit=async e=>{e.preventDefault();let fd=new FormData();fd.set("id",deptEditId.value);fd.set("dept","__DEPARTMENT__");fd.set("stage",deptStages.value);fd.set("subject",deptName.value);fd.set("teacher",deptIcon.value);fd.set("price","");fd.set("code","DEPT");let r=await fetch("/api/save",{method:"POST",body:fd});if(r.ok){await reload();closeDept();home();alert("تم حفظ القسم")}}
async function deleteDept(id){if(!confirm("حذف القسم من القائمة؟"))return;let f=new FormData();f.set("id",id);await fetch("/api/delete",{method:"POST",body:f});await reload();home()}
init()
</script></body></html>
